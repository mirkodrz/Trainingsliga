<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainingsliga FCSP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  --bg:#FAF7F3;--bg-alt:#EEEAE2;--card:#FFFFFF;--border:#DDD3C6;
  --text:#2B1810;--text-2:#7A6B5E;--text-3:#A89888;
  --primary:#6B3A2A;--primary-h:#5A2E1F;--primary-l:#A67358;--primary-s:#F5EDE5;
  --green:#2D8F4E;--green-s:#E3F2E8;--red:#C94040;--red-s:#FDEAEA;
  --gold:#B8880A;--gold-s:#FFF8E1;--silver:#8A8A8A;--bronze:#B0886A;
  --radius:10px;--radius-s:6px;
  --shadow:0 1px 3px rgba(43,24,16,.08);
  --shadow-m:0 2px 8px rgba(43,24,16,.10);
  --font-d:'Oswald',sans-serif;--font-b:'Source Sans 3',-apple-system,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141210;--bg-alt:#1E1A16;--card:#262018;--border:#3D3428;
  --text:#F0E8E0;--text-2:#A09488;--text-3:#706458;
  --primary:#C4896E;--primary-h:#D49A80;--primary-l:#A67358;--primary-s:#2E2218;
  --green:#4ACD73;--green-s:#172E1E;--red:#EF6B6B;--red-s:#2E1818;
  --gold:#F0C040;--gold-s:#2E2810;
  --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-m:0 2px 8px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#141210;--bg-alt:#1E1A16;--card:#262018;--border:#3D3428;
  --text:#F0E8E0;--text-2:#A09488;--text-3:#706458;
  --primary:#C4896E;--primary-h:#D49A80;--primary-l:#A67358;--primary-s:#2E2218;
  --green:#4ACD73;--green-s:#172E1E;--red:#EF6B6B;--red-s:#2E1818;
  --gold:#F0C040;--gold-s:#2E2810;
  --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-m:0 2px 8px rgba(0,0,0,.35);
}

body{background:var(--bg);color:var(--text);font-family:var(--font-b);margin:0;padding:0;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;min-height:100vh}

#app{max-width:520px;margin:0 auto;padding-bottom:80px;min-height:100vh}

/* ── Header ── */
.hdr-wrap{position:sticky;top:0;z-index:100}
.hdr{background:linear-gradient(135deg,var(--primary),var(--primary-h));color:#fff;
  padding:18px 16px 14px}
.hdr-title{font-family:var(--font-d);font-size:1.35rem;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;line-height:1.15}
.hdr-sub{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.hdr-team{font-family:var(--font-d);font-size:.9rem;font-weight:500;opacity:.85;letter-spacing:.03em}
.hdr-kw{font-family:var(--font-d);font-size:.85rem;font-weight:400;opacity:.7}
.hdr-back{background:none;border:none;color:#fff;padding:4px 8px 4px 0;cursor:pointer;display:flex;align-items:center;gap:4px;
  font-family:var(--font-b);font-size:.9rem;opacity:.85}
.hdr-back:hover{opacity:1}
.hdr-back svg{width:20px;height:20px}
.hdr-row{display:flex;justify-content:space-between;align-items:center}

/* ── Theme Banner ── */
.theme-banner{background:var(--gold-s);border-left:3px solid var(--gold);padding:10px 14px;
  margin:0;font-size:.85rem;display:flex;align-items:center;gap:8px}
.theme-label{font-family:var(--font-d);font-weight:600;text-transform:uppercase;font-size:.7rem;
  letter-spacing:.06em;color:var(--gold)}
.theme-value{font-weight:600;color:var(--text)}

/* ── Tabs ── */
.tab-bar{display:flex;gap:0;background:var(--card);border-bottom:1px solid var(--border)}
.tab-btn{flex:1;padding:10px 4px;background:none;border:none;border-bottom:2px solid transparent;
  font-family:var(--font-d);font-size:.72rem;font-weight:500;letter-spacing:.03em;text-transform:uppercase;
  color:var(--text-2);cursor:pointer;transition:all .2s;white-space:nowrap}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}

/* ── Sort Controls ── */
.sort-bar{display:flex;gap:6px;padding:10px 14px;background:var(--bg)}
.sort-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card);
  font-size:.75rem;font-weight:600;color:var(--text-2);cursor:pointer;transition:all .15s;font-family:var(--font-b)}
.sort-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ── League Table ── */
.league-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.league-table th{font-family:var(--font-d);text-transform:uppercase;font-size:.7rem;letter-spacing:.06em;
  color:var(--text-3);padding:8px 8px;text-align:left;border-bottom:2px solid var(--primary)}
.league-table td{padding:11px 8px;border-bottom:1px solid var(--border);font-size:.9rem}
.league-table tbody tr{cursor:pointer}
.league-table tbody tr:active{opacity:.7}
.league-table tbody tr:nth-child(odd){background:var(--card)}
.league-table tbody tr:nth-child(even){background:var(--bg-alt)}
.col-rank{width:32px;text-align:center;font-family:var(--font-d);font-weight:600;color:var(--text-2)}
.col-name{font-weight:600}
.col-pts{width:48px;text-align:center;font-family:var(--font-d);font-weight:700;font-size:1rem}
.col-chg{width:56px;text-align:right;font-size:.8rem;font-weight:600;white-space:nowrap}
.col-arr{width:20px;text-align:center;color:var(--text-3);font-size:.75rem;padding-right:4px}
.positive{color:var(--green)}.negative{color:var(--red)}.neutral{color:var(--text-3)}
.rank-medal{display:inline-block;width:22px;height:22px;border-radius:50%;text-align:center;
  line-height:22px;font-size:.7rem;font-weight:700;color:#fff}
.medal-1{background:var(--gold)}.medal-2{background:var(--silver)}.medal-3{background:var(--bronze)}

/* ── Activity Feed ── */
.feed{padding:8px 14px}
.feed-item{padding:10px 12px;margin-bottom:8px;background:var(--card);border-radius:var(--radius-s);
  border-left:3px solid var(--border);box-shadow:var(--shadow)}
.feed-item.pos{border-left-color:var(--green)}.feed-item.neg{border-left-color:var(--red)}
.feed-name{font-weight:600;font-size:.9rem}
.feed-pts{font-weight:700;font-family:var(--font-d)}
.feed-pts.pos{color:var(--green)}.feed-pts.neg{color:var(--red)}
.feed-cat{color:var(--text-2);font-size:.8rem}
.feed-time{color:var(--text-3);font-size:.75rem;margin-top:2px}
.feed-row{display:flex;justify-content:space-between;align-items:baseline}

/* ── Milestones ── */
.milestones{padding:14px}
.ms-card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);
  border-left:3px solid var(--border)}
.ms-card.reached{border-left-color:var(--gold)}
.ms-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ms-value{font-family:var(--font-d);font-weight:700;font-size:1.1rem}
.ms-label{font-family:var(--font-d);font-weight:500;font-size:.75rem;text-transform:uppercase;
  letter-spacing:.05em;color:var(--text-2)}
.ms-names{font-size:.85rem;color:var(--text-2)}
.ms-bar{height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.ms-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .4s ease}

/* ── Footer / Login ── */
.footer-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  padding:12px 16px;background:var(--card);border-top:1px solid var(--border);z-index:100;
  box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.trainer-btn{width:100%;padding:13px;border-radius:var(--radius);border:none;
  background:var(--primary);color:#fff;font-family:var(--font-d);font-size:.9rem;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:8px;transition:background .15s}
.trainer-btn:hover{background:var(--primary-h)}
.trainer-btn svg{width:18px;height:18px}

/* ── Modal ── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;
  justify-content:center;padding:20px;animation:fadeIn .2s ease}
.modal-card{background:var(--card);border-radius:var(--radius);padding:28px 24px;width:100%;max-width:320px;
  box-shadow:var(--shadow-m);text-align:center}
.modal-title{font-family:var(--font-d);font-size:1.1rem;font-weight:600;margin-bottom:16px;
  text-transform:uppercase;letter-spacing:.03em}
.pin-input{width:140px;text-align:center;font-size:1.5rem;letter-spacing:.5em;padding:10px;
  border:2px solid var(--border);border-radius:var(--radius-s);background:var(--bg);color:var(--text);
  font-family:var(--font-d);font-weight:600}
.pin-input:focus{outline:none;border-color:var(--primary)}

/* ── Buttons ── */
.btn{padding:10px 18px;border-radius:var(--radius-s);border:none;font-family:var(--font-b);
  font-size:.9rem;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;line-height:1.3}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-h)}
.btn-secondary{background:var(--bg-alt);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.9}
.btn-success{background:var(--green);color:#fff}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-block{width:100%;padding:14px}
.btn-group{display:flex;gap:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── Action Grid ── */
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.action-card{background:var(--card);border-radius:var(--radius);padding:16px 12px;text-align:center;
  box-shadow:var(--shadow);cursor:pointer;border:1px solid var(--border);transition:all .15s;
  display:flex;flex-direction:column;align-items:center;gap:8px}
.action-card:hover{box-shadow:var(--shadow-m);transform:translateY(-1px)}
.action-card:active{transform:translateY(0)}
.action-icon{width:32px;height:32px;color:var(--primary)}
.action-icon svg{width:100%;height:100%}
.action-label{font-family:var(--font-d);font-size:.8rem;font-weight:500;text-transform:uppercase;
  letter-spacing:.03em;line-height:1.2}

/* ── Sub-Screen ── */
.sub-hdr{display:flex;align-items:center;gap:8px;padding:14px;background:var(--card);
  border-bottom:1px solid var(--border)}
.sub-title{font-family:var(--font-d);font-size:1rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.sub-back{background:none;border:none;color:var(--primary);cursor:pointer;padding:4px;display:flex}
.sub-back svg{width:22px;height:22px}
.sub-content{padding:14px}
.sub-footer{padding:14px;position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:520px;background:var(--bg);z-index:90;
  border-top:1px solid var(--border);box-shadow:0 -2px 8px rgba(0,0,0,.06)}

/* ── Player Check List ── */
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);
  border-radius:var(--radius-s);border:1px solid var(--border);cursor:pointer;transition:background .1s;
  min-height:48px}
.pitem:active{background:var(--bg-alt)}
.pitem.checked{border-color:var(--green);background:var(--green-s)}
.pitem-name{flex:1;font-weight:600;font-size:.9rem}
.pitem-extra{font-size:.75rem;color:var(--text-2);display:flex;align-items:center;gap:4px}
.checkbox{width:22px;height:22px;border-radius:4px;border:2px solid var(--border);display:flex;
  align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;background:var(--card)}
.checkbox.on{background:var(--green);border-color:var(--green);color:#fff}
.checkbox svg{width:14px;height:14px}
.fitness-badge{padding:3px 8px;border-radius:12px;font-size:.7rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.03em;cursor:pointer;transition:all .15s;
  border:1px solid var(--border);color:var(--text-2);background:var(--bg)}
.fitness-badge.on{background:var(--primary-s);border-color:var(--primary-l);color:var(--primary)}

/* ── Team Selection ── */
.team-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.team-name{flex:1;font-weight:600;font-size:.9rem}
.team-btns{display:flex;gap:4px}
.team-btn{width:40px;height:36px;border-radius:var(--radius-s);border:1px solid var(--border);
  background:var(--card);font-family:var(--font-d);font-weight:700;font-size:.85rem;cursor:pointer;
  transition:all .15s;color:var(--text-2)}
.team-btn.ta{background:var(--primary);color:#fff;border-color:var(--primary)}
.team-btn.tb{background:var(--text);color:var(--card);border-color:var(--text)}
.team-btn.tn{background:var(--bg-alt);color:var(--text-3);border-color:var(--border)}
.winner-btns{display:flex;gap:8px;margin-top:8px}
.winner-btns .btn{flex:1}
.team-count{text-align:center;padding:6px;font-size:.8rem;color:var(--text-2);
  font-family:var(--font-d);font-weight:500}

/* ── Forms ── */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:.8rem;font-weight:600;margin-bottom:4px;color:var(--text-2);
  font-family:var(--font-d);text-transform:uppercase;letter-spacing:.04em}
.form-input,.form-select{width:100%;padding:10px 12px;border:1px solid var(--border);
  border-radius:var(--radius-s);background:var(--card);color:var(--text);font-size:.9rem;
  font-family:var(--font-b)}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(107,58,42,.15)}

/* ── Info Cards ── */
.info-card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;
  box-shadow:var(--shadow);border:1px solid var(--border)}
.info-card h3{font-family:var(--font-d);font-size:.85rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.03em;margin:0 0 8px;color:var(--text-2)}

/* ── Log ── */
.log-item{background:var(--card);border-radius:var(--radius-s);padding:12px;margin-bottom:8px;
  border:1px solid var(--border);cursor:pointer}
.log-header{display:flex;justify-content:space-between;align-items:center}
.log-date{font-family:var(--font-d);font-weight:600}
.log-stats{font-size:.8rem;color:var(--text-2)}
.log-details{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:.85rem}
.log-entry{display:flex;justify-content:space-between;padding:3px 0;color:var(--text-2)}

/* ── Player Mgmt ── */
.pm-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);
  border-radius:var(--radius-s);border:1px solid var(--border);margin-bottom:6px}
.pm-item.inactive{opacity:.5}
.pm-name{flex:1;font-weight:600;font-size:.9rem}
.pm-actions{display:flex;gap:6px}
.pm-btn{padding:8px 12px;border-radius:var(--radius-s);border:1px solid var(--border);min-height:36px;
  background:var(--bg);font-size:.75rem;font-weight:600;cursor:pointer;color:var(--text-2);transition:all .15s}
.pm-btn:hover{background:var(--border)}

/* ── Empty State ── */
.empty{text-align:center;padding:40px 20px;color:var(--text-2)}
.empty-title{font-family:var(--font-d);font-size:1rem;font-weight:600;margin-bottom:4px;color:var(--text)}

/* ── Toast ── */
#toast-wrap{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:300;
  display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:400px;width:90%}
.toast{padding:10px 16px;border-radius:var(--radius-s);box-shadow:var(--shadow-m);
  font-size:.85rem;font-weight:600;opacity:0;transform:translateY(12px);
  transition:all .25s ease;text-align:center}
.toast.show{opacity:1;transform:translateY(0)}
.toast-ok{background:var(--green);color:#fff}
.toast-err{background:var(--red);color:#fff}
.toast-info{background:var(--card);color:var(--text);border:1px solid var(--border)}

/* ── Confirmation ── */
.confirm-box{background:var(--red-s);border:1px solid var(--red);border-radius:var(--radius);
  padding:14px;margin-bottom:14px}
.confirm-box p{margin:0 0 10px;font-size:.9rem}

/* ── Section heading ── */
.sec-heading{font-family:var(--font-d);font-size:.8rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:var(--text-2);padding:14px 14px 6px}

/* ── Animations ── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .2s ease}.slide-up{animation:slideUp .25s ease}

/* ── Scrollable ── */
.scroll-x{overflow-x:auto}

/* ── Helpers ── */
.mt-2{margin-top:14px}.mb-2{margin-bottom:14px}.text-center{text-align:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.gap-2{gap:14px}.hidden{display:none!important}

/* ── Radio-like select row ── */
.select-row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);
  border-radius:var(--radius-s);border:1px solid var(--border);margin-bottom:6px;cursor:pointer;
  min-height:48px;transition:all .15s}
.select-row:active{background:var(--bg-alt)}
.select-row.selected{border-color:var(--primary);background:var(--primary-s)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .15s}
.radio.on{border-color:var(--primary)}.radio.on::after{content:'';width:10px;height:10px;
  border-radius:50%;background:var(--primary)}

/* ── Category badge ── */
.cat-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.02em}
.cat-pos{background:var(--green-s);color:var(--green)}
.cat-neg{background:var(--red-s);color:var(--red)}

/* ── Bonus list ── */
.bonus-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);
  border-radius:var(--radius-s);border:1px solid var(--border);margin-bottom:6px}
.bonus-item.qualifies{border-left:3px solid var(--green)}
.bonus-item.not-qual{border-left:3px solid var(--red);opacity:.7}
.bonus-pct{font-family:var(--font-d);font-weight:700;font-size:.85rem;min-width:42px;text-align:right}
.bonus-done{color:var(--green);font-size:.75rem;font-weight:600}

/* ── Rules ── */
.rules{padding:14px}
.rule-card{background:var(--card);border-radius:var(--radius-s);padding:12px 14px;margin-bottom:8px;
  border-left:3px solid var(--primary-l);box-shadow:var(--shadow)}
.rule-card.rule-neg{border-left-color:var(--red)}
.rule-card.rule-info{border-left-color:var(--gold)}
.rule-title{font-family:var(--font-d);font-weight:600;font-size:.9rem;margin-bottom:2px}
.rule-text{font-size:.85rem;color:var(--text-2);line-height:1.4}
.rule-edit-row{display:flex;gap:6px;align-items:center;margin-top:8px}

/* ── Erfolge Editor ── */
.ms-edit-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);
  border-radius:var(--radius-s);border:1px solid var(--border);margin-bottom:6px}
.ms-edit-value{font-family:var(--font-d);font-weight:700;font-size:1rem;flex:1}

/* ── Player Detail ── */
.pd-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.pd-stat{background:var(--card);border-radius:var(--radius-s);padding:10px;text-align:center;border:1px solid var(--border)}
.pd-stat-val{font-family:var(--font-d);font-weight:700;font-size:1.2rem}
.pd-stat-lbl{font-size:.7rem;color:var(--text-2);text-transform:uppercase;letter-spacing:.03em;font-family:var(--font-d)}
.pd-entry{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--card);
  border-radius:var(--radius-s);border:1px solid var(--border);margin-bottom:4px;font-size:.85rem}
.pd-entry-info{display:flex;flex-direction:column;gap:1px}

let UI={view:'player',tab:'table',screen:null,sort:'points',auth:false,authAt:0,pinModal:false};
const AUTH_TIMEOUT=30*60*1000; /* 30 minutes */
function isAuth(){return UI.auth&&(Date.now()-UI.authAt<AUTH_TIMEOUT)}

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCi2ZXylN_rf6N8S5PXPxxqBftGBy3KX1Y",
  authDomain: "trainingsliga-fcsp-4.firebaseapp.com",
  projectId: "trainingsliga-fcsp-4",
  storageBucket: "trainingsliga-fcsp-4.firebasestorage.app",

  appId: "1:1024456343662:web:7073715de48df48ad2e67f"
};

/* temp screen state */

function defaultState(){return{players:[],entries:[],weeklyTheme:'',weeklyThemeDate:'',pin:'1234',
  rules:DEFAULT_RULES.map(r=>({...r})),milestones:DEFAULT_MILESTONES.map(m=>({...m}))}}
function migrate(d){
  /* ensure existing rules get pts from defaults where applicable */
  let rules=d.rules&&d.rules.length?d.rules:DEFAULT_RULES.map(r=>({...r}));
  rules=rules.map(r=>{
    if(typeof r.pts==='number')return r;
    const def=DEFAULT_RULES.find(dr=>dr.title===r.title);
    return def&&typeof def.pts==='number'?{...r,pts:def.pts}:r;
  });
  return{players:d.players||[],entries:d.entries||[],
  weeklyTheme:d.weeklyTheme||'',weeklyThemeDate:d.weeklyThemeDate||'',pin:d.pin||'1234',
  rules,milestones:migrateMilestones(d.milestones)}}
function migrateMilestones(arr){
  if(!arr||!arr.length)return DEFAULT_MILESTONES.map(m=>({...m}));
  return arr.map(m=>{
    if(typeof m==='number'){
      const def=DEFAULT_MILESTONES.find(d=>d.value===m);
      return{value:m,title:def?def.title:m+' Punkte'}
    }
    return{value:m.value,title:m.title||m.value+' Punkte'}
  })}

/* ═══════════════════════════ PERSISTENCE ═══════════════════════════ */
async function initFirebase(){
  if(FIREBASE_CONFIG.apiKey==='DEIN_API_KEY'){
    console.warn('Firebase nicht konfiguriert – lokaler Modus');return false}
  try{
    const app=firebase.initializeApp(FIREBASE_CONFIG);
    fbDb=firebase.firestore();
    await firebase.auth().signInAnonymously();
    fbReady=true;
    /* Echtzeit-Listener: aktualisiert bei jedem Gerät automatisch */
    fbDb.doc(FB_DOC).onSnapshot(snap=>{
      if(fbSaving){fbSaving=false;return}
      if(snap.exists){S=migrate(snap.data());R()}
    });
    return true;
  }catch(e){console.error('Firebase init error:',e);return false}
}

async function load(){
  /* Firebase-Daten kommen über onSnapshot – hier nur Fallback */
  if(fbReady){
    try{const snap=await fbDb.doc(FB_DOC).get();
      if(snap.exists){S=migrate(snap.data());return}}catch(e){}
  }
  try{const s=localStorage.getItem('tl_v2');if(s){S=migrate(JSON.parse(s));return}}catch(e){}
  S=defaultState();
}

async function save(){
  try{localStorage.setItem('tl_v2',JSON.stringify(S))}catch(e){}
  if(fbReady){
    try{fbSaving=true;await fbDb.doc(FB_DOC).set(JSON.parse(JSON.stringify(S)))}
    catch(e){fbSaving=false;console.error('Save error:',e);toast('Speichern fehlgeschlagen','err')}
  }
}

/* ═══════════════════════════ UTILITIES ═══════════════════════════ */
function uid(){return crypto.randomUUID?crypto.randomUUID():(
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16)}))}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function today(){return new Date().toISOString().slice(0,10)}
function isoWeek(dt){const d=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));
  d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));
  const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-y)/864e5)+1)/7)}
function fmtDate(ds){if(!ds)return'';const[y,m,d]=ds.split('-');return`${d}.${m}.${y}`}
function relDate(ds){const now=new Date();now.setHours(0,0,0,0);const[y,m,d]=ds.split('-');
  const dt=new Date(y,m-1,d);const diff=Math.round((now-dt)/864e5);
  if(diff===0)return'Heute';if(diff===1)return'Gestern';if(diff<7)return`vor ${diff} Tagen`;return fmtDate(ds)}
function fmtTime(ts){const d=new Date(ts);return`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function monthStr(d){const dt=d||new Date();return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`}
function monthName(d){return MONTHS[(d||new Date()).getMonth()]}

/* ═══════════════════════════ QUERIES ═══════════════════════════ */
function activePlayers(){return S.players.filter(p=>p.active)}

function pts(pid){return Math.max(0,S.entries.filter(e=>e.playerId===pid).reduce((s,e)=>s+e.points,0))}

function ptsAsOf(pid,before){return Math.max(0,S.entries.filter(e=>e.playerId===pid&&e.timestamp<=before).reduce((s,e)=>s+e.points,0))}

function weekDelta(pid){const now=Date.now(),wa=now-7*864e5;return pts(pid)-ptsAsOf(pid,wa)}

function attCount(pid,ms){
  return S.entries.filter(e=>e.playerId===pid&&e.category==='Anwesenheit'&&(!ms||e.date.startsWith(ms))).length}


function rulePts(title,fallback){
  const rule=(S.rules||[]).find(r=>r.title===title);
  return rule&&typeof rule.pts==='number'?rule.pts:fallback;
}

function avgPts(){const ap=activePlayers();if(!ap.length)return 0;
  return Math.round(ap.reduce((s,p)=>s+pts(p.id),0)/ap.length)}

function sortedPlayers(){
  const ap=activePlayers().map(p=>({...p,points:pts(p.id),delta:weekDelta(p.id),att:attCount(p.id)}));
  if(UI.sort==='name')ap.sort((a,b)=>a.name.localeCompare(b.name,'de'));
  else if(UI.sort==='change')ap.sort((a,b)=>b.delta-a.delta||b.points-a.points||b.att-a.att);
  else ap.sort((a,b)=>b.points-a.points||b.att-a.att);
  return ap;
}

function recentFeed(n=10){
  return S.entries.slice().sort((a,b)=>b.timestamp-a.timestamp).slice(0,n).map(e=>{
    const p=S.players.find(pl=>pl.id===e.playerId);
    const cat=CATS.find(c=>c.name===e.category)||{};
    return{...e,playerName:p?p.name:'Unbekannt',catId:cat.id||'other'}})}

function milestoneData(ms){
  const t=typeof ms==='number'?ms:ms.value;
  const title=typeof ms==='object'&&ms.title?ms.title:'';
  const reached=activePlayers().filter(p=>pts(p.id)>=t);
  const closest=activePlayers().filter(p=>pts(p.id)<t)
    .sort((a,b)=>pts(b.id)-pts(a.id))[0];
  return{threshold:t,title,reached,closest}}

function trainingSessions(){
  const map={};
  S.entries.forEach(e=>{if(!map[e.date])map[e.date]=[];map[e.date].push(e)});
  return Object.keys(map).sort((a,b)=>b.localeCompare(a)).map(d=>({
    date:d,entries:map[d],
    playerCount:new Set(map[d].map(e=>e.playerId)).size,
    totalPts:map[d].reduce((s,e)=>s+e.points,0)
  }))}

function monthlyBonusData(){
  const ms=monthStr();
  const dates=new Set(S.entries.filter(e=>e.category==='Anwesenheit'&&e.date.startsWith(ms)).map(e=>e.date));
  const total=dates.size;
  if(!total)return{total:0,month:monthName(),players:[]};
  const pdata=activePlayers().map(p=>{
    const att=attCount(p.id,ms);const rate=att/total;
    const done=S.entries.some(e=>e.playerId===p.id&&e.category==='Monatsbonus'&&e.date.startsWith(ms));
    return{...p,att,total,rate,qualifies:rate>=0.8,done}});
  return{total,month:monthName(),players:pdata}}

/* ═══════════════════════════ MUTATIONS ═══════════════════════════ */
function addPlayer(name){
  const avg=avgPts();
  const p={id:uid(),name:name.trim(),active:true,createdAt:Date.now()};
  S.players.push(p);
  if(avg>0){
    S.entries.push({id:uid(),playerId:p.id,points:avg,category:'Startbonus',
      comment:`Einstieg mit Kaderdurchschnitt (${avg})`,date:today(),timestamp:Date.now(),batchId:uid()});
  }
}

function addEntries(list){
  const batch=uid();let ts=Date.now();const d=tDate||today();
  list.forEach(e=>{S.entries.push({id:uid(),playerId:e.pid,points:e.pts,category:e.cat,
    comment:e.comment||'',date:d,timestamp:ts++,batchId:batch})});
}

function undoLast(){
  if(!S.entries.length)return false;
  const last=S.entries[S.entries.length-1];const bid=last.batchId;
  const count=S.entries.filter(e=>e.batchId===bid).length;
  S.entries=S.entries.filter(e=>e.batchId!==bid);
  return count;
}

function feedHtml(){

function msVal(m){return typeof m==='number'?m:m.value}

      <div class="ms-header">

    </div>`}).join('')}</div>`}

/* ── Rules (Player View) ── */
function ruleClass(r){
  if(/[-–]\s*\d/.test(r.text)||/abzug|strafe|verlust|minus/i.test(r.text))return'rule-neg';
  if(/allgemein|start|info|hinweis|regel/i.test(r.title)&&!/\+\d/.test(r.text))return'rule-info';
  return'';
}
function rulesHtml(){
  const rules=S.rules&&S.rules.length?S.rules:DEFAULT_RULES;
  if(!rules.length)return`<div class="empty slide-up"><div class="empty-title">Keine Regeln hinterlegt</div></div>`;
  return`<div class="rules">${rules.map(r=>`
    <div class="rule-card ${ruleClass(r)} slide-up">
      <div class="rule-title">${esc(r.title)}</div>
      <div class="rule-text">${esc(r.text)}</div>
    </div>`).join('')}</div>`}

/* ── Undo ── */
function undoHtml(){
  if(!S.entries.length)return`${subHdr('Rückgängig')}
    <div class="sub-content"><div class="empty"><p>Keine Einträge vorhanden.</p></div></div>`;
  const last=S.entries[S.entries.length-1];
  const bid=last.batchId;
  const batch=S.entries.filter(e=>e.batchId===bid);
  const players=batch.map(e=>{const p=S.players.find(pl=>pl.id===e.playerId);return p?p.name:'?'});
  const uniqueNames=[...new Set(players)];
  return`${subHdr('Rückgängig')}

    <div class="confirm-box">
      <p><strong>Letzte Aktion rückgängig machen?</strong></p>

      <p style="font-size:.85rem">Spieler: ${uniqueNames.map(n=>esc(n)).join(', ')}</p>
      <p style="font-size:.85rem">Kategorien: ${[...new Set(batch.map(e=>e.category))].join(', ')}</p>
    </div>
    <button class="btn btn-danger btn-block" data-action="confirm-undo">Rückgängig machen</button>
  </div>`}

/* ═══════════════════════════ EVENT HANDLING ═══════════════════════════ */
function openScreen(screen){
  UI.screen=screen;
  /* reset temp state */
  tAtt={};tFit={};tDate=today();tTeams={};tWinner=null;tSelPlayer=null;
  tCat='attendance';tPts=1;tComment='';tNewName='';tEditId=null;tEditName='';
  tTheme='';tCustom='';tNewPin='';tConfPin='';tLogOpen={};
  tRuleEditId=null;tRuleTitle='';tRuleText='';tRulePts=null;tMsEditIdx=null;tMsValue='';tMsTitle='';tNewMsValue='';tNewMsTitle='';
  tSearchFilter='';tLogLimit=20;
  R();window.scrollTo(0,0);
}

app.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el||el.disabled)return;
  const a=el.dataset.action;

  try{ switch(a){
    /* Navigation */
    case'tab':UI.tab=el.dataset.tab;tFeedLimit=15;tDetailPlayer=null;R();window.scrollTo(0,0);break;
    case'player-detail':tDetailPlayer=el.dataset.id;tDetailLimit=20;R();window.scrollTo(0,0);break;
    case'close-detail':tDetailPlayer=null;R();window.scrollTo(0,0);break;
    case'detail-more':tDetailLimit+=20;R();break;
    case'sort':UI.sort=el.dataset.sort;R();break;
    case'open-pin':{
      if(isAuth()){UI.view='trainer';R();window.scrollTo(0,0);break}
      UI.pinModal=true;R();break}
    case'close-modal':closePinModal();break;
    case'back-player':UI.view='player';UI.screen=null;R();window.scrollTo(0,0);break;
    case'screen':openScreen(el.dataset.screen);break;
    case'screen-back':UI.screen=null;R();window.scrollTo(0,0);break;

    /* Attendance */
    case'toggle-att':{const id=el.dataset.id;tAtt[id]=!tAtt[id];if(!tAtt[id])tFit[id]=false;R();break}
    case'toggle-fit':{const id=el.dataset.id;tFit[id]=!tFit[id];R();break}
    case'att-all':{const pl=activePlayers();const filtered=tSearchFilter?pl.filter(p=>p.name.toLowerCase().includes(tSearchFilter.toLowerCase())):pl;
      filtered.forEach(p=>tAtt[p.id]=true);R();break}
    case'att-none':{const pl=activePlayers();const filtered=tSearchFilter?pl.filter(p=>p.name.toLowerCase().includes(tSearchFilter.toLowerCase())):pl;
      filtered.forEach(p=>{tAtt[p.id]=false;tFit[p.id]=false});R();break}
    case'save-att':{
      const list=[];
      const dateStr=tDate||today();
      const dupes=[];
      const attPts=rulePts('Anwesenheit',1);
      const fitPts=rulePts('Fitnesseinheit',1);
      activePlayers().forEach(p=>{
        if(tAtt[p.id]){
          if(S.entries.some(e=>e.playerId===p.id&&e.category==='Anwesenheit'&&e.date===dateStr))dupes.push(p.name);
          list.push({pid:p.id,pts:attPts,cat:'Anwesenheit'});
          if(tFit[p.id])list.push({pid:p.id,pts:fitPts,cat:'Fitnesseinheit'})}
      });
      if(!list.length){toast('Keine Spieler ausgewählt','err');break}
      if(dupes.length){toast(`Achtung: ${dupes.length} Spieler haben bereits Anwesenheit für ${fmtDate(dateStr)}`,'err');
        if(el.dataset.confirmed!=='1'){el.dataset.confirmed='1';
          el.textContent='Trotzdem speichern?';setTimeout(()=>{el.textContent=`Anwesenheit speichern (${list.filter(e=>e.cat==='Anwesenheit').length})`;delete el.dataset.confirmed},3000);break}}
      addEntries(list);save();toast(`${list.length} Einträge gespeichert`);UI.screen=null;R();window.scrollTo(0,0);break}

    /* Game Result */
    case'set-team':{const id=el.dataset.id;tTeams[id]=el.dataset.team||null;R();break}
    case'set-winner':tWinner=el.dataset.team;R();break;
    case'save-game':{
      const type=el.dataset.type;
      const tA=activePlayers().filter(p=>tTeams[p.id]==='a');
      const tB=activePlayers().filter(p=>tTeams[p.id]==='b');
      if(!tA.length||!tB.length){toast('Beide Teams brauchen Spieler','err');break}
      if(!tWinner){toast('Bitte Sieger wählen','err');break}
      const list=[];
      if(type==='game'){
        const winPts=rulePts('Sieg Trainingsform',2);
        const losePts=rulePts('Zweiter Platz Trainingsform',1);
        if(tWinner==='draw'){
          [...tA,...tB].forEach(p=>list.push({pid:p.id,pts:losePts,cat:'Zweiter Platz Trainingsform',comment:'Unentschieden'}))
        }else{
          const win=tWinner==='a'?tA:tB;const lose=tWinner==='a'?tB:tA;
          win.forEach(p=>list.push({pid:p.id,pts:winPts,cat:'Sieg Trainingsform'}));
          lose.forEach(p=>list.push({pid:p.id,pts:losePts,cat:'Zweiter Platz Trainingsform'}))
        }
      }else{
        const finalPts=rulePts('Sieg Abschlussspiel',2);
        const win=tWinner==='a'?tA:tB;
        win.forEach(p=>list.push({pid:p.id,pts:finalPts,cat:'Sieg Abschlussspiel'}))
      }
      addEntries(list);save();toast(`${list.length} Punkte vergeben`);UI.screen=null;R();window.scrollTo(0,0);break}

    /* Player of Training */
    case'sel-player':tSelPlayer=el.dataset.id;R();break;
    case'save-pot':{
      if(!tSelPlayer){toast('Bitte Spieler wählen','err');break}
      const potPts=rulePts('Spieler des Trainings',2);
      addEntries([{pid:tSelPlayer,pts:potPts,cat:'Spieler des Trainings'}]);
      save();const p=S.players.find(pl=>pl.id===tSelPlayer);
      toast(`${p?p.name:'Spieler'}: +${potPts} Punkte`);UI.screen=null;R();window.scrollTo(0,0);break}

    /* Single Points */
    case'save-single':{
      if(!tSelPlayer){toast('Bitte Spieler wählen','err');break}
      if(tPts===0){toast('0 Punkte können nicht vergeben werden','err');break}
      const cat=MANUAL_CATS.find(c=>c.id===tCat);
      addEntries([{pid:tSelPlayer,pts:tPts,cat:cat?cat.name:'Sonstiges',comment:tComment}]);
      save();toast('Punkte vergeben');UI.screen=null;R();window.scrollTo(0,0);break}

    /* Player Management */
    case'add-player':{
      const inp=document.getElementById('add-name');
      const name=(inp?inp.value:'').trim();
      if(!name){toast('Bitte Name eingeben','err');break}
      if(S.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){toast('Spieler existiert bereits','err');break}
      addPlayer(name);save();tNewName='';toast(`${name} hinzugefügt`);R();window.scrollTo(0,0);break}
    case'edit-player':tEditId=el.dataset.id;tEditName=(S.players.find(p=>p.id===el.dataset.id)||{}).name||'';R();break;
    case'save-edit':{
      const inp=document.getElementById('edit-name');
      const name=(inp?inp.value:'').trim();
      if(!name){toast('Name darf nicht leer sein','err');break}
      if(S.players.some(pl=>pl.id!==tEditId&&pl.name.toLowerCase()===name.toLowerCase())){toast('Name existiert bereits','err');break}
      const p=S.players.find(pl=>pl.id===tEditId);if(p)p.name=name;
      save();tEditId=null;tEditName='';toast('Name geändert');R();break}
    case'cancel-edit':tEditId=null;tEditName='';R();break;
    case'deactivate-player':{
      const p=S.players.find(pl=>pl.id===el.dataset.id);
      if(el.dataset.confirmed!=='1'){el.textContent='Sicher?';el.dataset.confirmed='1';
        setTimeout(()=>{el.textContent='Deakt.';delete el.dataset.confirmed},2500);break}
      if(p)p.active=false;
      save();toast(`${p?p.name:'Spieler'} deaktiviert`);R();break}
    case'activate-player':{
      const p=S.players.find(pl=>pl.id===el.dataset.id);if(p)p.active=true;
      save();toast(`${p?p.name:'Spieler'} aktiviert`);R();break}

    /* Monthly Bonus */
    case'save-bonus':{
      const d=monthlyBonusData();
      const qual=d.players.filter(p=>p.qualifies&&!p.done);
      if(!qual.length){toast('Keine berechtigten Spieler','err');break}
      const list=qual.map(p=>({pid:p.id,pts:3,cat:'Monatsbonus',comment:`${d.month} (≥ 80%)`}));
      addEntries(list);save();toast(`Bonus an ${qual.length} Spieler vergeben`);R();break}

    /* Weekly Theme */
    case'save-theme':{
      const theme=tTheme==='__custom__'?tCustom.trim():tTheme;
      if(!theme){toast('Bitte Thema wählen','err');break}
      S.weeklyTheme=theme;S.weeklyThemeDate=today();
      save();toast('Wochenthema gesetzt');UI.screen=null;R();window.scrollTo(0,0);break}
    case'clear-theme':S.weeklyTheme='';S.weeklyThemeDate='';save();toast('Wochenthema entfernt');R();break;

    /* Rules Editor */
    case'add-rule':tRuleEditId='__new__';tRuleTitle='';tRuleText='';tRulePts=null;R();break;
    case'edit-rule':{
      const idx=parseInt(el.dataset.idx);const r=S.rules[idx];
      if(r){tRuleEditId=r.id;tRuleTitle=r.title;tRuleText=r.text;tRulePts=typeof r.pts==='number'?r.pts:null}R();
      setTimeout(()=>{const f=document.getElementById('rule-editor-form');if(f)f.scrollIntoView({behavior:'smooth',block:'center'})},50);break}
    case'cancel-rule':tRuleEditId=null;tRuleTitle='';tRuleText='';tRulePts=null;R();break;
    case'save-rule':{
      if(!tRuleTitle.trim()||!tRuleText.trim()){toast('Titel und Text benötigt','err');break}
      if(tRuleEditId==='__new__'){
        const newRule={id:uid(),title:tRuleTitle.trim(),text:tRuleText.trim()};
        if(tRulePts!==null)newRule.pts=tRulePts;
        S.rules.push(newRule)
      }else{
        const r=S.rules.find(r=>r.id===tRuleEditId);
        if(r){r.title=tRuleTitle.trim();r.text=tRuleText.trim();if(tRulePts!==null)r.pts=tRulePts}
      }
      tRuleEditId=null;tRuleTitle='';tRuleText='';tRulePts=null;save();toast('Regel gespeichert');R();break}
    case'delete-rule':{
      const idx=parseInt(el.dataset.idx);
      if(idx>=0&&idx<S.rules.length){
        if(el.dataset.confirmed!=='1'){el.textContent='Sicher?';el.dataset.confirmed='1';
          setTimeout(()=>{el.textContent='Lösch.';delete el.dataset.confirmed},2500);break}
        S.rules.splice(idx,1);save();toast('Regel gelöscht');R()}break}
    case'move-rule-up':{
      const idx=parseInt(el.dataset.idx);
      if(idx>0){[S.rules[idx-1],S.rules[idx]]=[S.rules[idx],S.rules[idx-1]];save();R()}break}
    case'move-rule-down':{
      const idx=parseInt(el.dataset.idx);
      if(idx<S.rules.length-1){[S.rules[idx],S.rules[idx+1]]=[S.rules[idx+1],S.rules[idx]];save();R()}break}

    case'reset-rules':{
      if(el.dataset.confirmed!=='1'){el.textContent='Wirklich zurücksetzen?';el.dataset.confirmed='1';
        setTimeout(()=>{el.textContent='Standardregeln wiederherstellen';delete el.dataset.confirmed},2500);break}
      S.rules=DEFAULT_RULES.map(r=>({...r}));save();toast('Standardregeln wiederhergestellt');R();break}

    /* Milestones Editor */
    case'edit-ms':{
      const idx=parseInt(el.dataset.idx);const sorted=msSorted();const m=sorted[idx];
      tMsEditIdx=idx;tMsValue=String(msVal(m));tMsTitle=typeof m==='object'&&m.title?m.title:'';R();
      setTimeout(()=>{const f=document.getElementById('ms-editor-form');if(f)f.scrollIntoView({behavior:'smooth',block:'center'})},50);break}
    case'cancel-ms-edit':tMsEditIdx=null;tMsValue='';tMsTitle='';R();break;
    case'save-ms-edit':{
      const newVal=parseInt(tMsValue);
      if(!newVal||newVal<=0){toast('Ungültiger Wert','err');break}
      const sorted=msSorted();const oldM=sorted[tMsEditIdx];
      const realIdx=S.milestones.indexOf(oldM);
      if(realIdx>=0){
        if(S.milestones.some((m,i)=>msVal(m)===newVal&&i!==realIdx)){toast('Erfolg existiert bereits','err');break}
        S.milestones[realIdx]={value:newVal,title:tMsTitle.trim()};
      }
      tMsEditIdx=null;tMsValue='';tMsTitle='';save();toast('Erfolg geändert');R();break}
    case'delete-ms':{
      const val=parseInt(el.dataset.val);
      if(el.dataset.confirmed!=='1'){el.textContent='Sicher?';el.dataset.confirmed='1';
        setTimeout(()=>{el.textContent='Lösch.';delete el.dataset.confirmed},2500);break}
      S.milestones=S.milestones.filter(m=>msVal(m)!==val);
      save();toast('Erfolg gelöscht');R();break}
    case'add-ms':{
      const val=parseInt(tNewMsValue);
      if(!val||val<=0){toast('Ungültiger Wert','err');break}
      if(S.milestones.some(m=>msVal(m)===val)){toast('Erfolg existiert bereits','err');break}
      S.milestones.push({value:val,title:tNewMsTitle.trim()});tNewMsValue='';tNewMsTitle='';
      save();toast(`Erfolg ${val} hinzugefügt`);R();break}

    /* Feed & Log */
    case'feed-more':tFeedLimit+=20;R();break;
    case'log-more':tLogLimit+=20;R();break;
    case'toggle-log':tLogOpen[el.dataset.date]=!tLogOpen[el.dataset.date];R();break;

    /* PIN Change */
    case'save-pin':{
      if(!tNewPin||tNewPin!==tConfPin){toast('PINs stimmen nicht überein','err');break}
      S.pin=tNewPin;save();toast('PIN geändert');UI.screen=null;R();window.scrollTo(0,0);break}

    /* Data */
    case'export-csv':exportCsv();break;
    case'export-json':exportJson();break;
    case'trigger-import':{
      if(el.dataset.confirmed!=='1'){el.textContent='Wirklich importieren? Daten werden überschrieben!';
        el.style.color='var(--red)';el.dataset.confirmed='1';
        setTimeout(()=>{el.innerHTML=`${I.plus} JSON importieren`;el.style.color='';delete el.dataset.confirmed},3000);break}
      document.getElementById('import-file')?.click();break}
    case'confirm-undo':{
      const count=undoLast();if(count===false){toast('Nichts zum Rückgängig machen','err');break}
      save();toast(`${count} Einträge rückgängig gemacht`);UI.screen=null;R();window.scrollTo(0,0);break}
  }
  }catch(err){console.error('Action error:',a,err);toast('Fehler: '+err.message,'err')}
});

app.addEventListener('change',e=>{
  const el=e.target.closest('[data-change]');
  if(!el)return;
  switch(el.dataset.change){
    case'att-date':tDate=el.value;break;
    case'single-player':tSelPlayer=el.value||null;R();break;
    case'single-cat':{
      tCat=el.value;const cat=MANUAL_CATS.find(c=>c.id===tCat);
      tPts=cat?cat.pts:0;R();break}
    case'single-pts':tPts=parseInt(el.value)||0;break;
    case'single-comment':tComment=el.value;break;
    case'add-name':tNewName=el.value;break;
    case'edit-name':tEditName=el.value;break;
    case'theme-select':tTheme=el.value;R();break;
    case'theme-custom':tCustom=el.value;R();break;
    case'new-pin':tNewPin=el.value;R();break;
    case'conf-pin':tConfPin=el.value;R();break;
    case'rule-title':tRuleTitle=el.value;updateBtnState();break;
    case'rule-text':tRuleText=el.value;updateBtnState();break;
    case'rule-pts':tRulePts=parseInt(el.value)||0;break;
    case'ms-edit-value':tMsValue=el.value;updateBtnState();break;
    case'ms-edit-title':tMsTitle=el.value;break;
    case'new-ms-value':tNewMsValue=el.value;updateBtnState();break;
    case'new-ms-title':tNewMsTitle=el.value;break;
    case'search-filter':tSearchFilter=el.value;updateFilteredList();break;
    case'import-json':{
      const file=el.files?.[0];if(!file)break;
      const reader=new FileReader();
      reader.onload=async ev=>{
        try{S=migrate(JSON.parse(ev.target.result));await save();R();toast('Daten importiert')}
        catch(err){toast('Ungültige Datei','err')}};
      reader.readAsText(file);break}
  }
});

app.addEventListener('input',e=>{
  const el=e.target.closest('[data-change]');
  if(!el)return;
  switch(el.dataset.change){
    case'add-name':tNewName=el.value;break;
    case'edit-name':tEditName=el.value;break;
    case'single-comment':tComment=el.value;break;
    case'single-pts':tPts=parseInt(el.value)||0;break;
    case'new-pin':tNewPin=el.value;break;

    case'rule-title':tRuleTitle=el.value;updateBtnState();break;
    case'rule-text':tRuleText=el.value;updateBtnState();break;
    case'rule-pts':tRulePts=parseInt(el.value)||0;break;
    case'ms-edit-value':tMsValue=el.value;updateBtnState();break;
    case'ms-edit-title':tMsTitle=el.value;break;
    case'new-ms-value':tNewMsValue=el.value;updateBtnState();break;
    case'new-ms-title':tNewMsTitle=el.value;break;

  }
});

app.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(e.target.id==='add-name'){app.querySelector('[data-action="add-player"]')?.click();e.preventDefault()}
    if(e.target.id==='edit-name'){app.querySelector('[data-action="save-edit"]')?.click();e.preventDefault()}
  }
});

function handlePinSubmit(){
  const inp=document.getElementById('pin-input');
  if(inp&&inp.value===S.pin){UI.auth=true;UI.authAt=Date.now();UI.view='trainer';UI.pinModal=false;R()}
  else{toast('Falscher PIN','err');if(inp)inp.value=''}
}

/* ═══════════════════════════ EXPORT ═══════════════════════════ */
async function exportCsv(){
  const players=sortedPlayers();
  const ms=monthStr();
  const totalDates=new Set(S.entries.filter(e=>e.category==='Anwesenheit'&&e.date.startsWith(ms)).map(e=>e.date)).size;
  let csv=`﻿Rang;Name;Punkte;Anwesenheit;7-Tage-Änderung;Quote ${monthName()} (%)\n`;
  const csvField=v=>/[;"\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;
  players.forEach((p,i)=>{
    const mAtt=attCount(p.id,ms);
    const pct=totalDates?Math.round((mAtt/totalDates)*100):'–';
    csv+=`${i+1};${csvField(p.name)};${p.points};${p.att};${p.delta>0?'+':''}${p.delta};${pct}\n`});
  await offerDownload('trainingsliga.csv',csv);
}

async function exportJson(){
  const data=JSON.stringify(S,null,2);
  await offerDownload('trainingsliga.json',data);
}

async function offerDownload(filename,data){
  try{
    const blob=new Blob([data],{type:'text/plain'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);toast('Heruntergeladen');
  }catch(e){toast('Download fehlgeschlagen','err')}
}

/* ═══════════════════════════ TOAST ═══════════════════════════ */
function toast(msg,type='ok'){
  const wrap=document.getElementById('toast-wrap');
  const el=document.createElement('div');
  el.className=`toast toast-${type}`;el.textContent=msg;
  wrap.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300)},2200);
}

(async()=>{
  await initFirebase();
  await load();
  R();
})();
